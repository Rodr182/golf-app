# Reparte en la base lo que hoy está junto: una fila por comunidad.
#
# POR QUÉ: las fechas y los eventos de TODAS las comunidades viven en una sola
# fila. Mientras sea así, para que alguien vea lo suyo hay que dejarlo leer esa
# fila entera — o sea, también lo de las comunidades a las que no pertenece. El
# filtro lo hace la app en el celular, no el servidor. Con una fila por
# comunidad el servidor puede entregar solo lo que a cada uno le toca.
#
# QUÉ HACE: por cada comunidad crea "gb_rounds_v2:<id>", "gb_events_v1:<id>" y
# "gb_histcards_v1:<id>" con lo que le corresponde.
#
# QUÉ NO HACE:
#   - No borra las filas de antes. Siguen ahí, intactas, y la app las sigue
#     leyendo y escribiendo. Volver a la versión anterior de la app no pierde
#     nada. Quitarlas es un paso aparte, al final de todo.
#   - No toca una fila por comunidad que ya exista: si la app ya la escribió
#     (con datos más nuevos), se respeta. La app fusiona sola lo que falte.
#   - No cambia los permisos de lectura. Eso es el paso siguiente.
#
# Sin escribir "ESCRIBIR" solo informa: dice qué filas crearía y no toca nada.
name: Separar los datos por comunidad

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Vacío = solo mirar. Escribe ESCRIBIR para crear las filas"
        required: false
        default: ""
      limpiar:
        description: "Escribe LIMPIAR para borrar además la fila vieja de las casuales (solo si cada una ya tiene la suya)"
        required: false
        default: ""

permissions: {}

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Repartir
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          CONFIRMAR: ${{ inputs.confirmar }}
          LIMPIAR: ${{ inputs.limpiar }}
        run: |
          set -euo pipefail
          [ -n "$SB_TOKEN" ] || { echo "ERROR: falta el secreto SUPABASE_TOKEN"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" "$@"; }
          proyectos=$(api https://api.supabase.com/v1/projects)
          if ! echo "$proyectos" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "ERROR: la API de Supabase no devolvió la lista de proyectos."
            echo "Respuesta: $(echo "$proyectos" | head -c 300)"
            echo "Suele ser el token: se renueva en Supabase -> Account -> Access Tokens"
            echo "y se reemplaza en GitHub -> Settings -> Secrets -> Actions -> SUPABASE_TOKEN."
            exit 1
          fi
          ref=$(echo "$proyectos" | jq -r '[.[] | select(.name | test("machetero|golf"; "i"))][0].id // .[0].id')
          q() {
            local resp
            resp=$(api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" -d "$(jq -n --arg s "$1" '{query:$s}')")
            echo "$resp" | jq -e 'type == "array"' > /dev/null 2>&1 \
              || { echo "ERROR de la base: $(echo "$resp" | head -c 400)" >&2; exit 1; }
            printf '%s' "$resp"
          }

          # Dónde va cada elemento. Las fechas y los eventos de una comunidad, a
          # la fila de esa comunidad. Una ronda CASUAL no es de ninguna, así que
          # no hay a quién preguntarle si uno puede verla: va sola en su propia
          # fila, y los permisos deciden mirando quién jugó.
          DESTINO="case when coalesce(e->>'communityId','libre') = 'libre'
                        then 'libre:' || coalesce(e->>'id','sin-id')
                        else e->>'communityId' end"

          echo "== 1. CÓMO ESTÁ HOY =="
          q "select c.key,
                    pg_size_pretty(pg_column_size(c.value)::bigint) as peso,
                    case when jsonb_typeof(c.value)='array' then jsonb_array_length(c.value) end as elementos,
                    to_char(c.updated_at, 'YYYY-MM-DD HH24:MI') as ultimo_cambio_utc
             from public.collections c
             where c.key in ('gb_rounds_v2','gb_events_v1','gb_histcards_v1')
                or c.key like 'gb_rounds_v2:%' or c.key like 'gb_events_v1:%' or c.key like 'gb_histcards_v1:%'
             order by c.key;" | jq -r '.[] | "  \(.key)\t\(.peso)\t\(.elementos // "-") elemento(s)\t\(.ultimo_cambio_utc)"'

          # Si alguien estuviera anotando una ronda casual AHORA, repartirla le
          # movería la fila donde está escribiendo. Lo que importa no es que
          # esté "sin cerrar" — hay rondas de hace meses que quedaron así — sino
          # que sea de los últimos días.
          echo ""
          echo "== 1b. ¿HAY ALGUNA RONDA CASUAL EN JUEGO AHORA? =="
          abiertas=$(q "select distinct e->>'id' as id, e->>'name' as nombre, e->>'date' as fecha,
                               e->>'status' as estado,
                               (current_date - (e->>'date')::date) as dias
                        from public.collections c, jsonb_array_elements(c.value) e
                        where (c.key = 'gb_events_v1' or c.key like 'gb_events_v1:libre%')
                          and coalesce(e->>'communityId','libre') = 'libre'
                          and coalesce(e->>'status','') <> 'cerrado'
                        order by dias;")
          recientes=$(echo "$abiertas" | jq '[.[] | select(.dias <= 3)] | length')
          viejas=$(echo "$abiertas" | jq '[.[] | select(.dias > 3)] | length')
          if [ "$recientes" = "0" ]; then
            echo "  No hay ninguna ronda casual de los últimos 3 días. Se puede repartir."
          else
            echo "  ⚠️  CUIDADO: hay $recientes ronda(s) casual(es) de los últimos 3 días sin cerrar."
            echo "$abiertas" | jq -r '.[] | select(.dias <= 3) | "  ⚠️  \(.nombre) · \(.fecha) · \(.estado) · hace \(.dias) día(s)"'
            echo "  Si alguien está anotando una de esas, mejor esperar a que la cierre."
          fi
          if [ "$viejas" != "0" ]; then
            echo "  (Además hay $viejas ronda(s) casual(es) viejas que quedaron sin cerrar;"
            echo "   no estorban al reparto, pero les siguen apareciendo como activas a quien las jugó:)"
            echo "$abiertas" | jq -r '.[] | select(.dias > 3) | "     · \(.nombre) · \(.fecha) · hace \(.dias) días"'
          fi

          echo ""
          echo "== 2. QUÉ FILAS HARÍAN FALTA =="
          # El nombre de la fila se arma desde la RAÍZ de la clave, no desde la
          # clave entera: si no, una fila que ya es "...:libre" daría
          # "...:libre:libre:ev123". Y se cuenta por id distinto, porque el
          # mismo evento está a la vez en la fila única y en la de casuales.
          q "with sueltos as (
               select split_part(c.key, ':', 1) || ':' || ${DESTINO} as fila,
                      count(distinct e->>'id') as n
               from public.collections c, jsonb_array_elements(c.value) e
               where c.key in ('gb_rounds_v2','gb_events_v1','gb_histcards_v1',
                               'gb_rounds_v2:libre','gb_events_v1:libre','gb_histcards_v1:libre')
               group by 1)
             select s.fila, s.n as elementos,
                    exists (select 1 from public.collections c2 where c2.key = s.fila) as ya_existe
             from sueltos s order by 1;" \
            | jq -r '.[] | "  \(.fila)\t\(.elementos) elemento(s)\t\(if .ya_existe then "ya existe, no se toca" else "se crearía" end)"'

          if [ "${CONFIRMAR}" != "ESCRIBIR" ]; then
            echo ""
            echo "Modo solo mirar: no se escribió nada."
            echo "Para crear las filas, volver a lanzar escribiendo ESCRIBIR."
            exit 0
          fi

          echo ""
          echo "== 3. CREANDO LAS FILAS QUE FALTAN =="
          # "on conflict do nothing": si la app ya escribió la fila de una
          # comunidad, lo que tiene es igual o más nuevo que esto. Pisarla
          # podría borrar una fecha recién consolidada.
          # Hay DOS orígenes posibles: la fila única de siempre y la fila donde
          # iban juntas todas las casuales. Un mismo evento está en las dos, así
          # que NO se pueden leer juntas: saldría repetido dentro de la fila
          # nueva. Se hacen dos pasos, el más nuevo primero, y el
          # "on conflict do nothing" hace que el segundo solo llene lo que falte.
          reparte() {
            q "insert into public.collections (key, value, updated_at)
               select '$1' || ':' || ${DESTINO},
                      jsonb_agg(e order by (e->>'id') collate \"C\"),
                      now()
               from public.collections c, jsonb_array_elements(c.value) e
               where c.key = '$2'
               group by 1
               on conflict (key) do nothing;" > /dev/null
          }
          for raiz in gb_rounds_v2 gb_events_v1 gb_histcards_v1; do
            reparte "$raiz" "$raiz:libre"   # primero la de casuales, que es la más nueva
            reparte "$raiz" "$raiz"         # después la fila única, para lo que falte
            echo "  $raiz: hecho"
          done

          echo ""
          echo "== 4. COMPROBACIÓN: NADA SE QUEDÓ AFUERA =="
          # Por cada elemento de la fila de antes, tiene que haber uno con el
          # mismo id en la fila de su comunidad. Si falta alguno, este flujo
          # falla: es justo lo que no se puede dejar pasar.
          faltan=$(q "with antes as (
                        select c.key as raiz, e->>'id' as id,
                               split_part(c.key, ':', 1) || ':' || ${DESTINO} as fila
                        from public.collections c, jsonb_array_elements(c.value) e
                        where c.key in ('gb_rounds_v2','gb_events_v1','gb_rounds_v2:libre','gb_events_v1:libre')),
                      ahora as (
                        select c.key as fila, e->>'id' as id
                        from public.collections c, jsonb_array_elements(c.value) e
                        where c.key like 'gb_rounds_v2:%' or c.key like 'gb_events_v1:%')
                      select a.raiz, a.id, a.fila from antes a
                      where not exists (select 1 from ahora n where n.fila = a.fila and n.id = a.id)
                      order by 1, 2;")
          n=$(echo "$faltan" | jq 'length')
          if [ "$n" != "0" ]; then
            echo "⛔ ME DETENGO: $n elemento(s) no llegaron a la fila de su comunidad:"
            echo "$faltan" | jq -r '.[] | "  \(.raiz) · \(.id) · debería estar en \(.fila)"'
            echo ""
            echo "Las filas de antes siguen intactas, así que no se perdió nada."
            exit 1
          fi
          echo "  Todas las fechas y todos los eventos están en la fila que les toca."

          # Y que no haya quedado nada repetido DENTRO de una fila: dos copias
          # del mismo evento en la misma fila harían que la fusión se confunda.
          repes=$(q "select c.key as fila, e->>'id' as id, count(*) as veces
                     from public.collections c, jsonb_array_elements(c.value) e
                     where c.key like 'gb_rounds_v2:%' or c.key like 'gb_events_v1:%'
                     group by 1, 2 having count(*) > 1 order by 1, 2;")
          if [ "$(echo "$repes" | jq 'length')" != "0" ]; then
            echo "⛔ ME DETENGO: quedó algo repetido dentro de una fila:"
            echo "$repes" | jq -r '.[] | "  \(.fila) · \(.id) · \(.veces) veces"'
            exit 1
          fi
          echo "  Y no hay nada repetido dentro de ninguna fila."

          # Las tarjetas previas no tienen id: se comparan por cantidad.
          q "with antes as (
               select count(*) as n from public.collections c, jsonb_array_elements(c.value) e
               where c.key = 'gb_histcards_v1'),
             ahora as (
               select count(*) as n from public.collections c, jsonb_array_elements(c.value) e
               where c.key like 'gb_histcards_v1:%')
             select (select n from antes) as paquetes_antes, (select n from ahora) as paquetes_ahora;" | jq .

          # ---- Borrar la fila vieja de las casuales ----
          # Esta sí hay que borrarla, no solo dejar de usarla: lleva TODAS las
          # rondas casuales juntas, así que con los permisos nuevos cualquiera
          # que haya jugado UNA puede leerla entera. Las filas únicas de las
          # otras colecciones no tienen ese problema (nadie las puede leer) y se
          # quedan como respaldo.
          if [ "${LIMPIAR}" = "LIMPIAR" ]; then
            echo ""
            echo "== 4b. BORRANDO LA FILA VIEJA DE LAS CASUALES =="
            for raiz in gb_rounds_v2 gb_events_v1 gb_histcards_v1; do
              existe=$(q "select count(*) as n from public.collections where key = '$raiz:libre';" | jq -r '.[0].n')
              [ "$existe" = "0" ] && { echo "  $raiz:libre — ya no existe"; continue; }
              # Antes de borrar: cada cosa que lleva dentro tiene que estar ya en
              # su propia fila. Si falta una sola, no se borra nada.
              # OJO: acá NO se puede usar jsonb_array_elements sobre la tabla sin
              # filtrar primero. La base no garantiza que aplique el filtro de
              # clave antes de abrir el valor, y hay filas cuyo valor no es una
              # lista (gb_epoch es un número): reventaba con "cannot extract
              # elements from a scalar". Se pregunta con jsonb_path_exists, que
              # mira dentro de UNA fila sin abrirla en filas.
              sueltas=$(q "select e->>'id' as id
                           from public.collections c, jsonb_array_elements(c.value) e
                           where c.key = '$raiz:libre'
                             and not exists (
                               select 1 from public.collections c2
                               where c2.key = '$raiz:libre:' || (e->>'id')
                                 and jsonb_typeof(c2.value) = 'array'
                                 and jsonb_path_exists(c2.value, '\$[*] ? (@.id == \$buscado)',
                                                       jsonb_build_object('buscado', e->>'id')));")
              if [ "$(echo "$sueltas" | jq 'length')" != "0" ]; then
                echo "  ⛔ $raiz:libre NO se borra: estas no tienen su propia fila todavía:"
                echo "$sueltas" | jq -r '.[] | "     · \(.id)"'
                exit 1
              fi
              q "delete from public.collections where key = '$raiz:libre';" > /dev/null
              echo "  $raiz:libre — borrada (todo estaba ya en su propia fila)"
            done
          else
            echo ""
            echo "(La fila vieja de las casuales sigue ahí. Con los permisos nuevos,"
            echo " cualquiera que haya jugado una casual puede leerla entera, así que"
            echo " conviene borrarla: volver a lanzar escribiendo LIMPIAR.)"
          fi

          echo ""
          echo "== 5. CÓMO QUEDÓ =="
          q "select c.key, pg_size_pretty(pg_column_size(c.value)::bigint) as peso,
                    jsonb_array_length(c.value) as elementos
             from public.collections c
             where c.key in ('gb_rounds_v2','gb_events_v1','gb_histcards_v1')
                or c.key like 'gb_rounds_v2:%' or c.key like 'gb_events_v1:%' or c.key like 'gb_histcards_v1:%'
             order by c.key;" | jq -r '.[] | "  \(.key)\t\(.peso)\t\(.elementos) elemento(s)"'
          echo ""
          echo "Las filas de antes siguen ahí a propósito: la app las lee y las"
          echo "escribe igual que siempre, así que se puede volver atrás sin perder"
          echo "nada. Quitarlas es el último paso, cuando los permisos ya estén puestos."
