# Muestra qué hay guardado en la app (solo lectura, no modifica nada).
name: Ver datos de la app

on:
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inventario
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SB_TOKEN" ] || { echo "ERROR: falta el secreto SUPABASE_TOKEN"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" "$@"; }
          ref=$(api https://api.supabase.com/v1/projects | jq -r '[.[] | select(.name | test("machetero|golf"; "i"))][0].id // .[0].id')
          q() { api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" -d "$(jq -n --arg s "$1" '{query:$s}')"; echo ""; }

          echo "== Colecciones y cuándo se escribieron =="
          q "select key, updated_at, pg_column_size(value) as bytes from public.collections order by key;"

          echo "== Cuántos elementos hay en cada una =="
          q "select key, jsonb_array_length(value) as elementos from public.collections where jsonb_typeof(value)='array' order by key;"

          echo "== Rondas guardadas (fecha y jugadores) =="
          q "select r->>'eventName' as nombre, r->>'date' as fecha, r->>'communityId' as comunidad, jsonb_array_length(r->'teams') as grupos, jsonb_array_length(r->'results'->'rows') as jugadores from public.collections, jsonb_array_elements(value) r where key='gb_rounds_v2';"

          echo "== Rondas EN CURSO (aún sin consolidar) =="
          q "select e->>'name' as nombre, e->>'date' as fecha, e->>'communityId' as comunidad, e->>'status' as estado, jsonb_array_length(e->'groups') as grupos, (select count(*) from jsonb_array_elements(e->'groups') g, jsonb_each(g->'scores') s where jsonb_typeof(s.value)='array' and exists (select 1 from jsonb_array_elements_text(s.value) v where v.value <> '')) as jugadores_con_scores from public.collections, jsonb_array_elements(value) e where key='gb_events_v1';"

          echo "== DETALLE de los eventos: grupo por grupo, hoyos anotados y vacíos =="
          # Para cada jugador de cada grupo: cuántos hoyos tiene anotados y
          # cuáles le faltan. Sirve para ver si a alguien no se le guardó algo.
          # OJO con el alias `c`: sin él, `key` es ambiguo entre la tabla y el lateral.
          q "select e->>'date' as fecha, e->>'status' as estado, (g->>'id')::int as grupo,
                    g->>'scorerId' as anotador_id, s.key as jugador_id,
                    (g->'hcps'->>(s.key)) as hcp_del_dia,
                    (select count(*) from jsonb_array_elements_text(s.value) v where v.value <> '' and v.value <> 'null') as hoyos_anotados,
                    (select string_agg(t.ord::text, ',' order by t.ord)
                       from jsonb_array_elements_text(s.value) with ordinality t(v, ord)
                      where t.v = '' or t.v = 'null') as hoyos_vacios
             from public.collections c, jsonb_array_elements(c.value) e,
                  jsonb_array_elements(e->'groups') g, jsonb_each(g->'scores') s
             where c.key='gb_events_v1'
             order by 1 desc, 3, 5;"

          echo "== Tarjetas de las fechas YA CERRADAS (para ver hándicaps y golpes raros) =="
          q "select r->>'date' as fecha, (t->>'id')::int as grupo,
                    p->>'name' as jugador, (p->>'hcp') as hcp,
                    (select sum(x::int) from jsonb_array_elements_text(p->'gross') x) as gross_total,
                    (select count(*) from jsonb_array_elements_text(p->'gross') x where x is null or x = 'null' or x = '') as hoyos_sin_golpe
             from public.collections c, jsonb_array_elements(c.value) r,
                  jsonb_array_elements(r->'teams') t, jsonb_array_elements(t->'players') p
             where c.key='gb_rounds_v2'
             order by 1 desc, 2, 3;"

          echo "== Comunidades =="
          q "select c->>'name' as nombre, jsonb_array_length(c->'members') as miembros from public.collections, jsonb_array_elements(value) c where key='gb_comm_v2';"

          echo "== Jugadores registrados (y si tienen hándicap) =="
          q "select p->>'name' as nombre, p->>'email' as email, p->>'hcp' as hcp from public.collections, jsonb_array_elements(value) p where key='gb_players_v2';"

          echo "== Jugadores con nombre y apellido (para cruzar con la planilla) =="
          q "select p->>'id' as id, trim(coalesce(p->>'name','') || ' ' || coalesce(p->>'last','')) as nombre_completo, p->>'email' as email from public.collections, jsonb_array_elements(value) p where key='gb_players_v2' order by 2;"

          echo "== Plata por jugador en las fechas ya cerradas en la app =="
          q "select r->>'date' as fecha, row->>'id' as jugador_id, row->>'totalMoney' as soles, row->>'guest' as invitado from public.collections, jsonb_array_elements(value) r, jsonb_array_elements(r->'results'->'rows') row where key='gb_rounds_v2' order by 1,3;"

          echo "== Miembros de la comunidad =="
          q "select c->>'id' as comunidad_id, c->>'name' as nombre, c->'members' as miembros from public.collections, jsonb_array_elements(value) c where key='gb_comm_v2';"

          echo "== Cuántos NO tienen hándicap (jugarían a 0) =="
          q "select count(*) filter (where p->>'hcp' is null or p->>'hcp'='') as sin_handicap, count(*) as total from public.collections, jsonb_array_elements(value) p where key='gb_players_v2';"

          echo "== Cuentas en Supabase Auth =="
          q "select email, created_at from auth.users order by created_at;"
