# Carga en la comunidad las fechas de una temporada jugadas ANTES de usar la app.
#
# Qué hace: escribe la temporada en la fila PRIVADA del histórico de la
# comunidad ("gb_historico_v1:<id de comunidad>"), con lo que ganó o perdió cada
# jugador y en cuántas fechas jugó. NO crea rondas, no toca las fechas ya
# guardadas y no borra nada: solo agrega ese bloque.
#
# Antes se guardaba DENTRO de la comunidad, en los datos que cualquiera con
# cuenta puede leer (para buscar comunidades y postular). O sea: cualquiera
# podía ver cuánto ganó o perdió cada uno. Ahora solo lo leen sus miembros.
#
# Los datos salen de scripts/historico-<temporada>.json, que lleva los ids
# internos de cada jugador (nunca nombres, porque el repositorio es público).
#
# Para deshacerlo: correr con la temporada y marcar "borrar".
name: Cargar temporada anterior a la app

on:
  workflow_dispatch:
    inputs:
      temporada:
        description: "Temporada (año). Debe existir scripts/historico-<año>.json"
        required: true
        default: "2026"
      comunidad:
        description: "Nombre de la comunidad"
        required: true
        default: "Korn Ferry Boys"
      borrar:
        description: "Escribe BORRAR para quitar el histórico de esa temporada en vez de cargarlo"
        required: false
        default: ""
      jugador_id:
        description: "Sumar UN jugador que se registró después (su id de la app). Deja vacío para la carga normal."
        required: false
        default: ""
      jugador_soles:
        description: "Soles acumulados de ese jugador en las fechas previas (ej. -81)"
        required: false
        default: ""
      jugador_fechas:
        description: "En cuántas de esas fechas jugó (ej. 3)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargar el histórico en la comunidad
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          TEMPORADA: ${{ inputs.temporada }}
          COMUNIDAD: ${{ inputs.comunidad }}
          BORRAR: ${{ inputs.borrar }}
          JUG_ID: ${{ inputs.jugador_id }}
          JUG_SOLES: ${{ inputs.jugador_soles }}
          JUG_FECHAS: ${{ inputs.jugador_fechas }}
        run: |
          set -euo pipefail
          [ -n "$SB_TOKEN" ] || { echo "ERROR: falta el secreto SUPABASE_TOKEN"; exit 1; }
          archivo="scripts/historico-${TEMPORADA}.json"
          if [ -n "$JUG_ID" ]; then
            case "$JUG_ID" in *[!0-9a-fA-F-]*) echo "ERROR: el id no parece un id de la app"; exit 1;; esac
            case "$JUG_SOLES" in ""|*[!0-9.+-]*) echo "ERROR: 'jugador_soles' debe ser un numero"; exit 1;; esac
            case "$JUG_FECHAS" in ""|*[!0-9]*) echo "ERROR: 'jugador_fechas' debe ser un entero"; exit 1;; esac
          elif [ "$BORRAR" != "BORRAR" ] && [ ! -f "$archivo" ]; then
            echo "ERROR: no existe $archivo"; exit 1
          fi

          api() { curl -sS -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" "$@"; }
          # Si el token caducó o le quitaron permisos, la API contesta un error en
          # vez de la lista de proyectos. Sin esta comprobación el flujo reventaba
          # con un error de jq que no explicaba nada.
          proyectos=$(api https://api.supabase.com/v1/projects)
          if ! echo "$proyectos" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "ERROR: la API de Supabase no devolvió la lista de proyectos."
            echo "Respuesta: $(echo "$proyectos" | head -c 300)"
            echo "Suele ser el token: se renueva en Supabase -> Account -> Access Tokens"
            echo "y se reemplaza en GitHub -> Settings -> Secrets -> Actions -> SUPABASE_TOKEN."
            exit 1
          fi
          ref=$(echo "$proyectos" | jq -r '[.[] | select(.name | test("machetero|golf"; "i"))][0].id // .[0].id')
          q() { api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" -d "$(jq -n --arg s "$1" '{query:$s}')"; }

          # ¿Existe la comunidad? Si no, no se escribe nada.
          cid=$(q "select c->>'id' as id from public.collections k, jsonb_array_elements(k.value) c
                   where k.key = 'gb_comm_v2' and c->>'name' = \$nom\$${COMUNIDAD}\$nom\$;" | jq -r '.[0].id // empty')
          [ -n "$cid" ] || { echo "ERROR: no encontré la comunidad «$COMUNIDAD»."; exit 1; }
          case "$cid" in *[!A-Za-z0-9_-]*) echo "ERROR: id de comunidad raro: $cid"; exit 1;; esac
          fila="gb_historico_v1:$cid"
          echo "Comunidad «$COMUNIDAD» ($cid) → fila $fila"

          # Lo que hay hoy: en la fila privada, o todavía dentro de la comunidad
          # si no se trasladó. Se parte de ahí para no pisar otras temporadas.
          actual="coalesce(
                    (select h.value->0->'historico' from public.collections h where h.key = '$fila'),
                    (select c->'historico' from public.collections k, jsonb_array_elements(k.value) c
                      where k.key = 'gb_comm_v2' and c->>'id' = '$cid'),
                    '{}'::jsonb)"
          resumen() {
            q "select t.key as temporada, (t.value->>'fechas') as fechas,
                      (select count(*) from jsonb_object_keys(coalesce(t.value->'jugadores','{}'::jsonb))) as jugadores,
                      (select round(sum((v->>'money')::numeric)) from jsonb_each(coalesce(t.value->'jugadores','{}'::jsonb)) e(id, v)) as suma_soles
               from jsonb_each(${actual}) t order by 1;" | jq .
          }
          echo "== Antes =="
          resumen
          echo ""

          # El JSON se mete en el SQL con "dollar quoting" ($hist$…$hist$): así
          # no hay que escapar comillas y no se puede colar nada raro.
          if [ -n "$JUG_ID" ]; then
            # Suma o corrige UN jugador dentro de una temporada ya cargada, para
            # cuando alguien crea su cuenta después de la carga inicial.
            tiene=$(q "select (${actual}) ? \$tmp\$${TEMPORADA}\$tmp\$ as tiene;" | jq -r '.[0].tiene')
            [ "$tiene" = "true" ] || { echo "ERROR: la temporada $TEMPORADA no está cargada en «$COMUNIDAD»; primero hay que cargarla."; exit 1; }
            echo "== Sumando a la temporada $TEMPORADA el jugador $JUG_ID: S/$JUG_SOLES en $JUG_FECHAS fechas =="
            nuevo="jsonb_set(${actual}, array[\$tmp\$${TEMPORADA}\$tmp\$, 'jugadores', \$jid\$${JUG_ID}\$jid\$],
                             jsonb_build_object('money', ${JUG_SOLES}::numeric, 'fechas', ${JUG_FECHAS}::int), true)"
          elif [ "$BORRAR" = "BORRAR" ]; then
            echo "== Quitando el histórico de $TEMPORADA en «$COMUNIDAD» =="
            nuevo="(${actual}) - \$tmp\$${TEMPORADA}\$tmp\$"
          else
            hist=$(jq -c '{fechas, desde, hasta, nota, jugadores, pozo}' "$archivo")
            echo "== Cargando en «$COMUNIDAD» la temporada $TEMPORADA =="
            jq -r '"   \(.fechas) fechas, de \(.desde) a \(.hasta), \(.jugadores | length) jugadores"' "$archivo"
            jq -r '"   suma de la plata: \([.jugadores[].money] | add)"' "$archivo"
            case "$hist" in *'$hist$'*) echo "ERROR: el JSON contiene el delimitador"; exit 1;; esac
            nuevo="(${actual}) || jsonb_build_object(\$tmp\$${TEMPORADA}\$tmp\$, \$hist\$${hist}\$hist\$::jsonb)"
          fi

          sql="insert into public.collections (key, value, updated_at)
               values ('$fila',
                       jsonb_build_array(jsonb_build_object('communityId', '$cid', 'historico', ${nuevo})),
                       now())
               on conflict (key) do update set value = excluded.value, updated_at = now();"

          # La respuesta se revisa: si la base devuelve un error, el flujo se
          # detiene en vez de decir que todo salió bien.
          resp=$(q "$sql")
          echo "$resp" | jq -e 'if type=="object" and (has("message") or has("error")) then false else true end' > /dev/null \
            || { echo "ERROR de la base:"; echo "$resp"; exit 1; }

          echo ""
          echo "== Después =="
          resumen
          echo ""
          echo "Listo. Las fechas ya guardadas en la app no se tocaron."
