# Vacía los datos de la app en Supabase (tabla public.collections).
# Se ejecuta MANUALMENTE y exige escribir BORRAR para confirmar.
# No toca las cuentas de usuario (auth.users) ni la estructura de la base.
name: Borrar datos de la app

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe BORRAR para confirmar'
        required: true
        type: string

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar colecciones
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          set -euo pipefail
          [ "$CONFIRMAR" = "BORRAR" ] || { echo "No confirmado (escribe BORRAR). Nada se borró."; exit 1; }
          [ -n "$SB_TOKEN" ] || { echo "ERROR: falta el secreto SUPABASE_TOKEN"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" "$@"; }

          ref=$(api https://api.supabase.com/v1/projects | jq -r '[.[] | select(.name | test("machetero|golf"; "i"))][0].id // .[0].id')
          echo "Proyecto: $ref"

          echo "== Antes =="
          api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -d '{"query":"select key, pg_column_size(value) as bytes from public.collections order by key;"}'
          echo ""

          echo "== Borrando =="
          api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -d '{"query":"delete from public.collections;"}'
          echo ""

          echo "== Después =="
          api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
            -d '{"query":"select count(*) as filas from public.collections;"}'
          echo ""
          echo "LISTO: la app arranca limpia (las cuentas de usuario no se tocaron)."
