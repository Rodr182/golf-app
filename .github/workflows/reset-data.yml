# Borra datos de la app en Supabase. Se ejecuta MANUALMENTE y exige escribir
# BORRAR para confirmar. Nunca toca las cuentas de usuario (auth.users).
#
# alcance:
#   rondas  = solo el historial de rondas y los eventos (conserva comunidades,
#             jugadores y el catálogo de canchas)
#   todo    = vacía todas las colecciones de la app
#
# En ambos casos sube la "época" de los datos: las pestañas que hayan quedado
# abiertas con el estado anterior detectan el cambio, no suben nada y se
# recargan solas (evita que los datos borrados reaparezcan).
name: Borrar datos de la app

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe BORRAR para confirmar'
        required: true
        type: string
      alcance:
        description: 'Qué borrar'
        required: true
        default: rondas
        type: choice
        options: [rondas, todo]

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          CONFIRMAR: ${{ inputs.confirmar }}
          ALCANCE: ${{ inputs.alcance }}
        run: |
          set -euo pipefail
          [ "$CONFIRMAR" = "BORRAR" ] || { echo "No confirmado (escribe BORRAR). Nada se borró."; exit 1; }
          [ -n "$SB_TOKEN" ] || { echo "ERROR: falta el secreto SUPABASE_TOKEN"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" "$@"; }
          ref=$(api https://api.supabase.com/v1/projects | jq -r '[.[] | select(.name | test("machetero|golf"; "i"))][0].id // .[0].id')
          q() { api -X POST "https://api.supabase.com/v1/projects/$ref/database/query" -d "$(jq -n --arg s "$1" '{query:$s}')"; echo ""; }

          echo "Proyecto: $ref · alcance: $ALCANCE"
          echo "== Antes =="
          q "select key, coalesce(jsonb_array_length(value),0) as elementos from public.collections where key <> 'gb_epoch' order by key;"

          if [ "$ALCANCE" = "todo" ]; then
            q "delete from public.collections;"
          else
            q "delete from public.collections where key in ('gb_rounds_v2','gb_events_v1');"
          fi

          # Sube la época para que las pestañas viejas se recarguen en vez de reescribir
          q "insert into public.collections (key, value, updated_at) values ('gb_epoch', to_jsonb(extract(epoch from now())::bigint), now()) on conflict (key) do update set value = excluded.value, updated_at = now();"

          echo "== Después =="
          q "select key, coalesce(jsonb_array_length(value),0) as elementos from public.collections order by key;"
          echo "LISTO. Las cuentas de usuario no se tocaron."
