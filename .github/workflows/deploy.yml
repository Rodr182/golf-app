name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Red de seguridad: una compilación sin credenciales de Supabase es una
      # app en modo local — nadie podría entrar a su cuenta. Si eso pasa, el
      # despliegue se detiene ANTES de publicar en vez de dejar la app rota.
      - name: Verificar que la app quedó conectada a la base de datos
        run: |
          set -euo pipefail
          url=$(grep -o 'https://[a-z0-9]*\.supabase\.co' frontend/src/config.js | head -1 || true)
          if [ -z "$url" ]; then
            echo "ERROR: frontend/src/config.js no tiene la URL de Supabase."
            echo "La app se publicaria en modo local y nadie podria iniciar sesion."
            exit 1
          fi
          if ! grep -rqF "$url" frontend/dist/assets/; then
            echo "ERROR: la compilacion no contiene $url"
            exit 1
          fi
          echo "OK: la app publicada apunta a $url"
      - name: Publicar en la rama gh-pages
        run: |
          cd frontend/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicación automática desde ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
